[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "get-x-gif"
version = "0.5.0"
description = "下载 X（Twitter）博文中的 GIF 图：传入博文链接，下载其中的 GIF"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "get-x-gif contributors" }]
keywords = ["twitter", "x", "gif", "downloader", "media"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP",
]

[project.scripts]
get-x-gif = "getxgif.cli:main"

[tool.setuptools]
packages = ["getxgif"]
